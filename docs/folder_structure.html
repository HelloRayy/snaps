      position: absolute;
      left: 11px;
      top: 0;
      bottom: 0;
      width: 1.5px;
      background: var(--border, #e2e8f0);
    }
    .node-row:hover {
      background: rgba(61, 56, 245, 0.05);

    let currentFilter = 'all';
    let searchQuery = '';

    function renderTree(nodes, container, depth = 0, currentPath = '') {
      nodes.forEach(node => {
        const fullPath = currentPath ? `${currentPath}/${node.name.replace('/', '')}` : node.name.replace('/', '');
        const hasChildren = node.children && node.children.length > 0;
        
        // Filter match logic
        const matchesCategory = currentFilter === 'all' || node.category === currentFilter;
        const matchesSearch = !searchQuery || 
          node.name.toLowerCase().includes(searchQuery) || 
          (node.desc && node.desc.toLowerCase().includes(searchQuery)) ||
          (node.badge && node.badge.toLowerCase().includes(searchQuery)) ||
          childMatches(node, searchQuery);

        if (!matchesCategory && !searchQuery) return;
        if (searchQuery && !matchesSearch) return;

        const isExpanded = searchQuery ? true : (node.expanded ?? false);

        const nodeEl = document.createElement('div');
        nodeEl.className = 'node-wrapper';
        nodeEl.dataset.id = node.id;
        nodeEl.dataset.category = node.category;

        const row = document.createElement('div');
        row.className = `node-row flex items-center justify-between py-1.5 px-2 rounded-xl cursor-pointer transition ${depth > 0 ? 'ml-' + Math.min(depth * 3, 12) : ''}`;
        row.style.paddingLeft = `${depth * 18 + 8}px`;

        // Left section (chevron + icon + name + badge)
        const left = document.createElement('div');
        left.className = 'flex items-center gap-2 overflow-hidden mr-2';

        // Chevron
        if (hasChildren) {
          const chevron = document.createElement('span');
          chevron.className = 'w-4 h-4 flex items-center justify-center text-[var(--muted-foreground)] text-[10px] transition-transform duration-150';
          chevron.innerHTML = isExpanded ? '▼' : '▶';
          left.appendChild(chevron);
        } else {
          const spacer = document.createElement('span');
          spacer.className = 'w-4 h-4 flex items-center justify-center text-[var(--muted-foreground)] opacity-30 text-[10px]';
          spacer.innerHTML = node.isFile ? '•' : '○';
          left.appendChild(spacer);
        }

        // Folder/File Icon
        const icon = document.createElement('span');
        icon.className = 'text-xs shrink-0';
        if (node.isFile) {
          icon.innerHTML = `<svg class="w-3.5 h-3.5 text-[var(--muted-foreground)]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>`;
        } else {
          icon.innerHTML = `<svg class="w-4 h-4 text-[#3d38f5]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>`;
        }
        left.appendChild(icon);

        // Name
        const name = document.createElement('span');
        name.className = `mono text-xs sm:text-sm font-semibold truncate ${node.isFile ? 'text-[var(--foreground)] opacity-90' : 'text-[var(--foreground)]'}`;
        name.textContent = node.name;
        left.appendChild(name);

        // Badge
        if (node.badge) {
          const badge = document.createElement('span');
          badge.className = `text-[10px] px-2 py-0.5 rounded-md font-medium border shrink-0 ${node.badgeColor || 'bg-zinc-500/10 text-zinc-600 border-zinc-500/20'}`;
          badge.textContent = node.badge;
          left.appendChild(badge);
        }

        row.appendChild(left);

        // Right section (description)
        if (node.desc) {
          const desc = document.createElement('span');
          desc.className = 'text-[11px] sm:text-xs text-[var(--muted-foreground)] truncate hidden md:inline-block max-w-xs text-right shrink-0';
          desc.textContent = node.desc;
          row.appendChild(desc);
        }

        nodeEl.appendChild(row);

        // Children Container
        if (hasChildren) {
          const childContainer = document.createElement('div');
          childContainer.className = `children-container tree-line ${isExpanded ? 'block' : 'hidden'}`;
          renderTree(node.children, childContainer, depth + 1, fullPath);
          nodeEl.appendChild(childContainer);

          // Click handler to toggle
          row.addEventListener('click', (e) => {
            const isCurrentlyHidden = childContainer.classList.contains('hidden');
            if (isCurrentlyHidden) {
              childContainer.classList.remove('hidden');
              childContainer.classList.add('block');
              row.querySelector('span').innerHTML = '▼';
            } else {
              childContainer.classList.add('hidden');
              childContainer.classList.remove('block');
              row.querySelector('span').innerHTML = '▶';
            }
          });
        } else {
          // Click file to copy path
          row.addEventListener('click', () => {
            navigator.clipboard.writeText(fullPath).then(() => {
              showToast(`Path "${fullPath}" disalin!`);
            });
          });
        }

        container.appendChild(nodeEl);
      });
    }

    function childMatches(node, query) {
      if (!node.children) return false;
      return node.children.some(child => 
        child.name.toLowerCase().includes(query) ||
        (child.desc && child.desc.toLowerCase().includes(query)) ||
        (child.badge && child.badge.toLowerCase().includes(query)) ||
        childMatches(child, query)
      );
    }

    function updateView() {
      const container = document.getElementById('tree-container');
      container.innerHTML = '';
      renderTree(treeData, container, 0, '');

      // Update match count
      const totalVisible = container.querySelectorAll('.node-row').length;
      document.getElementById('match-counter').textContent = `Menampilkan ${totalVisible} item terdaftar`;
    }

    function setAllExpanded(expanded) {
      function traverse(nodes) {
        nodes.forEach(n => {
          n.expanded = expanded;
          if (n.children) traverse(n.children);
        });
      }
      traverse(treeData);
      updateView();
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.remove('translate-y-12', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      setTimeout(() => {
        toast.classList.add('translate-y-12', 'opacity-0');
        toast.classList.remove('translate-y-0', 'opacity-100');
      }, 2000);
    }

    // Event Listeners
    document.getElementById('btn-expand-all').addEventListener('click', () => setAllExpanded(true));
    document.getElementById('btn-collapse-all').addEventListener('click', () => setAllExpanded(false));

    document.getElementById('search-input').addEventListener('input', (e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      updateView();
    });

    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-chip').forEach(b => {
          b.className = 'filter-chip text-xs px-3 py-2 rounded-xl border border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] font-medium whitespace-nowrap transition';
        });
        btn.className = 'filter-chip active text-xs px-3 py-2 rounded-xl border border-[#3d38f5] bg-[#3d38f5] text-white font-medium whitespace-nowrap transition';
        currentFilter = btn.dataset.filter;
        updateView();
      });
    });

    // Initial Render
    updateView();
  </script>
</body>
</html>
