        <rect x="440" y="28" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="46" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Filter Kategori Jurusan</text>

        <rect x="440" y="66" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="84" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Kartu Utas &amp; Polling</text>

        <rect x="440" y="104" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="122" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Layar Detail Postingan</text>

        <!-- Sub Jelajah -->
        <rect x="440" y="227" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="245" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Kolom Pencarian Kata Kunci</text>

        <rect x="440" y="265" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="283" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Filter Hasil (Post / Akun)</text>

        <!-- Sub Buat Post -->
        <rect x="440" y="388" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="406" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Formulir Utas Diskusi</text>

        <rect x="440" y="426" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="444" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Unggah Media / Foto Karya</text>

        <rect x="440" y="464" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="482" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Formulir Polling Akademik</text>

        <!-- Sub Profil -->
        <rect x="440" y="568" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="586" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Kartu Biodata &amp; NIS Siswa</text>

        <rect x="440" y="606" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="624" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Tab Utas Saya &amp; Balasan</text>

        <rect x="440" y="644" width="200" height="28" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
        <text x="540" y="662" fill="#334155" font-size="9.5" font-family="'Inter', sans-serif" text-anchor="middle">Edit Profil &amp; Keluar Akun</text>


        <!-- ================= LEVEL 3 · AKSI & ELEMEN DETAIL ================= -->
        <!-- Aksi Filter Jurusan -->
        <rect x="670" y="28" width="240" height="28" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
        <text x="790" y="46" fill="#475569" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Semua · PPLG · DKV · Kuliner</text>

        <!-- Aksi Detail Post -->
        <rect x="670" y="104" width="240" height="28" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
        <text x="790" y="122" fill="#475569" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Komentar &amp; Input Balasan</text>

        <!-- Aksi Filter Cari -->
        <rect x="670" y="265" width="240" height="28" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
        <text x="790" y="283" fill="#475569" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Tab Postingan &amp; Akun Teman</text>

        <!-- Aksi Polling -->
        <rect x="670" y="464" width="240" height="28" rx="4" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3,3" />
        <text x="790" y="482" fill="#475569" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle">Pertanyaan &amp; Opsi Pilihan Suara</text>

        <!-- Aksi Profil Tab -->
