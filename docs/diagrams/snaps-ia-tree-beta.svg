        <text x="307" y="436" fill="#0F172A" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">3. Buat Post (FAB)</text>
        <text x="307" y="451" fill="#64748B" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Modal Input Konten</text>

        <!-- 4. Profil Siswa -->
        <rect x="220" y="596" width="175" height="48" rx="6" fill="#FFFFFF" stroke="#3D38F5" stroke-width="1.5" />
        <text x="307" y="616" fill="#0F172A" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">4. Profil Siswa</text>
        <text x="307" y="631" fill="#64748B" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Akun &amp; Riwayat</text>


        <!-- ================= LEVEL 2 · SUB-KONTEN / HALAMAN ================= -->
