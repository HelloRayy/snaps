        <rect x="220" y="56" width="175" height="48" rx="6" fill="#FFFFFF" stroke="#3D38F5" stroke-width="1.5" />
        <text x="307" y="76" fill="#0F172A" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">1. Linimasa Feed</text>
        <text x="307" y="91" fill="#64748B" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Beranda Utama</text>

        <!-- 2. Jelajah & Cari -->
        <rect x="220" y="236" width="175" height="48" rx="6" fill="#FFFFFF" stroke="#3D38F5" stroke-width="1.5" />
        <text x="307" y="256" fill="#0F172A" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">2. Jelajah &amp; Cari</text>
        <text x="307" y="271" fill="#64748B" font-size="8.5" font-family="'JetBrains Mono', monospace" text-anchor="middle">Pencarian Global</text>

        <!-- 3. Buat Postingan -->
