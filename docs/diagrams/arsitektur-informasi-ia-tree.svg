<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ia-tree-title ia-tree-desc" id="arsitektur-informasi-ia-tree-root">
        <title id="ia-tree-title">Peta Arsitektur Informasi Aplikasi</title>
        <desc id="ia-tree-desc">Diagram pohon hierarki menu aplikasi POS dari Dashboard Utama ke modul Master Data, Transaksi POS, Riwayat Penjualan, Laporan Keuangan, dan Pengaturan Profil Akun.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #arsitektur-informasi-ia-tree-root { --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-rule:    rgba(45,49,66,0.12);
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #arsitektur-informasi-ia-tree-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arsitektur-informasi-ia-tree-root .container { max-width: 1240px; margin: 0 auto; }
      #arsitektur-informasi-ia-tree-root .header-eyebrow { font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.75rem; }
      #arsitektur-informasi-ia-tree-root .subtitle { font-size: 1rem;
      line-height: 1.6;
      color: var(--color-muted);
      max-width: 72ch; }
      #arsitektur-informasi-ia-tree-root .diagram-container { background: var(--color-paper-2);
      border-radius: 8px;
      border: 1px solid var(--color-rule);
      padding: 1.5rem;
      overflow-x: auto; }
      #arsitektur-informasi-ia-tree-root .card-header { display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 0.875rem;
      padding-bottom: 0.875rem;
      border-bottom: 1px solid rgba(45,49,66,0.08); }
      #arsitektur-informasi-ia-tree-root .card-dot { width: 7px;
      height: 7px;
      border-radius: 50%; }
      #arsitektur-informasi-ia-tree-root .card-dot.coral { background: var(--color-accent); }
      #arsitektur-informasi-ia-tree-root .card-dot.ink { background: var(--color-ink); }
      #arsitektur-informasi-ia-tree-root .card-dot.muted { background: var(--color-muted); }</style>
          <pattern id="arsitektur-informasi-ia-tree-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
        </defs>

        <!-- Background -->
        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#arsitektur-informasi-ia-tree-dots)" opacity="0.55"/>

        <!-- Tier tags (Margin Kiri) -->
        <text x="36" y="96" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 0 · ROOT</text>
        <text x="36" y="226" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 1 · MODUL UTAMA</text>
        <text x="36" y="352" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">TIER 2 · SUB-MENU</text>

        <!-- Connectors (Drawn before boxes) -->
        <!-- Root -> Tier 1 Bus -->
        <path d="M 600 118 L 600 158 L 230 158 L 230 198" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 600 158 L 510 158 L 510 198" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 600 158 L 700 158 L 700 198" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 600 158 L 890 158 L 890 198" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 600 158 L 1080 158 L 1080 198" fill="none" stroke="#4f5d75" stroke-width="1"/>

        <!-- Master Data -> Tier 2 Sub-menus Bus -->
        <path d="M 230 248 L 230 286 L 100 286 L 100 326" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 230 286 L 230 326" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M 230 286 L 360 286 L 360 326" fill="none" stroke="#4f5d75" stroke-width="1"/>

        <!-- Tier 0: Root Node - Dashboard Utama (Aksen Coral Tunggal) -->
        <rect x="505" y="70" width="190" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="505" y="70" width="190" height="48" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <rect x="513" y="78" width="34" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
        <text x="530" y="87" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
        <text x="600" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dashboard Utama</text>
        <text x="600" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pusat kendali · ringkasan metrik</text>

        <!-- Tier 1: Master Data -->
        <rect x="150" y="200" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="150" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="158" y="208" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="177" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODUL</text>
        <text x="230" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Master Data</text>
        <text x="230" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">entitas · katalog dasar</text>

        <!-- Tier 1: Transaksi POS -->
        <rect x="430" y="200" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="430" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="438" y="208" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="457" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODUL</text>
        <text x="510" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Transaksi POS</text>
        <text x="510" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kasir · keranjang · bayar</text>

        <!-- Tier 1: Riwayat Penjualan -->
        <rect x="620" y="200" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="620" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="628" y="208" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="647" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODUL</text>
        <text x="700" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Riwayat Penjualan</text>
        <text x="700" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">log nota · filter transaksi</text>

        <!-- Tier 1: Laporan Keuangan -->
        <rect x="810" y="200" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="810" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="818" y="208" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="837" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODUL</text>
        <text x="890" y="226" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Laporan Keuangan</text>
        <text x="890" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">omzet · laba rugi · export</text>

        <!-- Tier 1: Pengaturan Profil Akun -->
        <rect x="1000" y="200" width="160" height="48" rx="6" fill="#f5f5f5"/>
        <rect x="1000" y="200" width="160" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="1008" y="208" width="38" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
        <text x="1027" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODUL</text>
        <text x="1080" y="226" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pengaturan Akun</text>
        <text x="1080" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">profil · sandi · preferensi</text>

        <!-- Tier 2: Leaf 1 - Produk -->
        <rect x="35" y="326" width="130" height="46" rx="6" fill="#f5f5f5"/>
        <rect x="35" y="326" width="130" height="46" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.04"/>
        <text x="100" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Produk</text>
        <text x="100" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">stok · barcode · harga</text>

        <!-- Tier 2: Leaf 2 - Kategori -->
        <rect x="165" y="326" width="130" height="46" rx="6" fill="#f5f5f5"/>
        <rect x="165" y="326" width="130" height="46" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.04"/>
        <text x="230" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kategori</text>
        <text x="230" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">kelompok komoditas</text>

        <!-- Tier 2: Leaf 3 - Pengguna -->
        <rect x="295" y="326" width="130" height="46" rx="6" fill="#f5f5f5"/>
        <rect x="295" y="326" width="130" height="46" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.04"/>
        <text x="360" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pengguna</text>
        <text x="360" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hak akses kasir / admin</text>

        <!-- Legend Bar (Bottom Strip) -->
        <line x1="36" y1="410" x2="1164" y2="410" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
        <rect x="36" y="424" width="10" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.10"/>
        <text x="52" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Root Hub (Aksen Utama)</text>

        <rect x="240" y="424" width="10" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="256" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Modul Utama (Tier 1)</text>

        <rect x="440" y="424" width="10" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="0.8" fill-opacity="0.05"/>
        <text x="456" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Sub-Menu / Leaf (Tier 2)</text>

        <line x1="640" y1="429" x2="660" y2="429" stroke="#4f5d75" stroke-width="1"/>
        <text x="668" y="432" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Alur Navigasi Hierarkis (Orthogonal Bus)</text>
      </svg>
