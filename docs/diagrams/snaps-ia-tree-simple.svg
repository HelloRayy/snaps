        <path d="M 200 385 L 240 385" fill="none" stroke="#94A3B8" stroke-width="1.5" />
        <!-- Bus Bar Vertikal Tier 1 (X=240, dari Y=56 sampai Y=710) -->
        <path d="M 240 56 L 240 710" fill="none" stroke="#94A3B8" stroke-width="1.5" />
